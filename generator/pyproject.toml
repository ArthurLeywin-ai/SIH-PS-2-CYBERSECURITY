[build-system]
requires = ["setuptools>=69.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "satsa-generator"
version = "0.1.0"
description = "SAT-SA Synthetic Dataset Generator — deterministic, offline, reproducible"
requires-python = ">=3.12,<3.13"
license = {text = "Proprietary — SIH 2026"}
readme = "README.md"

dependencies = [
    "numpy>=1.26,<2.0",
    "polars>=0.20,<1.0",
    "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.90",
    "ruff>=0.2",
]

[project.scripts]
satsa-gen = "satsa_generator.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "offline: tests that verify no network dependency",
    "determinism: tests that verify reproducible output",
    "contract: tests that verify DATA_SCHEMA.md contract",
]
