[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satsa-app"
version = "0.1.0"
description = "SAT-SA Supervisory Analytics Tool for SOC Assessment — Application & Ingestion Layer"
requires-python = ">=3.12"
license = {text = "Proprietary — SIH 2026"}
readme = "README.md"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
    "ruff>=0.2",
]

[project.scripts]
satsa-server = "app.backend.cli:serve"
satsa-ingest = "app.backend.cli:ingest"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
